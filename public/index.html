<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AMD</title>
<style>
  :root {
    --bg: #0a0b0d;
    --panel: rgba(255, 255, 255, 0.04);
    --border: rgba(255, 255, 255, 0.09);
    --border-strong: rgba(255, 255, 255, 0.18);
    --text: #eef0f2;
    --text-dim: #8b9096;
    --accent: #4fd1c5;
    --danger: #e0655b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .field {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }

  .field span {
    position: absolute;
    width: 1px;
    height: 1px;
    background: var(--accent);
    border-radius: 50%;
    opacity: 0;
    animation: drift 14s linear infinite;
  }

  @keyframes drift {
    0% { transform: translateY(110vh) translateX(0); opacity: 0; }
    8% { opacity: 0.5; }
    92% { opacity: 0.3; }
    100% { transform: translateY(-10vh) translateX(var(--dx, 0px)); opacity: 0; }
  }

  .card {
    position: relative;
    z-index: 1;
    width: min(380px, 88vw);
    padding: 48px 36px 40px;
    border-radius: 24px;
    background: var(--panel);
    border: 1px solid var(--border);
    backdrop-filter: blur(28px) saturate(140%);
    -webkit-backdrop-filter: blur(28px) saturate(140%);
    text-align: center;
    opacity: 0;
    transform: translateY(14px);
    animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  .mark {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.32em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .brand {
    margin-top: 18px;
    font-size: 40px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .sub {
    margin-top: 10px;
    font-size: 14px;
    color: var(--text-dim);
    line-height: 1.5;
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 32px 0 28px;
  }

  .signin-btn {
    position: relative;
    width: 100%;
    padding: 14px 20px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border-strong);
    color: var(--text);
    font-size: 15px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    overflow: hidden;
    transition: border-color 0.3s ease, background 0.3s ease, transform 0.15s ease;
  }

  .signin-btn:hover {
    border-color: rgba(255, 255, 255, 0.34);
    background: rgba(255, 255, 255, 0.09);
  }

  .signin-btn:active {
    transform: scale(0.98);
  }

  .signin-btn .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.25);
    transform: scale(0);
    animation: ripple 0.6s ease-out;
    pointer-events: none;
  }

  @keyframes ripple {
    to { transform: scale(3.2); opacity: 0; }
  }

  .signin-btn svg { flex-shrink: 0; }

  .status {
    margin-top: 20px;
    font-size: 13px;
    color: var(--text-dim);
    min-height: 18px;
    letter-spacing: 0.01em;
  }

  .status.error { color: var(--danger); }

  .foot {
    margin-top: 28px;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: rgba(139, 144, 150, 0.5);
    text-transform: uppercase;
  }

  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; opacity: 1; transform: none; }
    .field span { animation: none; opacity: 0; }
  }
</style>
</head>
<body>

  <div class="field" id="field"></div>

  <div class="card">
    <div class="mark">Codex &middot; M41NUL</div>
    <div class="brand">AMD</div>
    <div class="sub">All Media Downloader<br />Control Panel</div>

    <div class="divider"></div>

    <button class="signin-btn" id="signInBtn">
      <svg width="18" height="18" viewBox="0 0 18 18">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.85.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.18.29-1.72V4.95H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.05l3.01-2.33z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.59-2.59C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
      </svg>
      <span>Continue with Google</span>
    </button>

    <div class="status" id="status"></div>

    <div class="foot">Restricted Access</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBmdLTY_IIH4nykxRDKaPLX4rCVIuBSoS4",
      authDomain: "amd-whatsapp-bot.firebaseapp.com",
      projectId: "amd-whatsapp-bot",
      storageBucket: "amd-whatsapp-bot.firebasestorage.app",
      messagingSenderId: "223251809936",
      appId: "1:223251809936:web:919baaad02f13762baba15"
    };

    const ALLOWED_EMAIL = "devmainulislam@gmail.com";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const statusEl = document.getElementById("status");
    const btn = document.getElementById("signInBtn");

    function setStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.classList.toggle("error", isError);
    }

    btn.addEventListener("click", async (e) => {
      const rect = btn.getBoundingClientRect();
      const ripple = document.createElement("span");
      ripple.className = "ripple";
      const size = Math.max(rect.width, rect.height);
      ripple.style.width = ripple.style.height = size + "px";
      ripple.style.left = (e.clientX - rect.left - size / 2) + "px";
      ripple.style.top = (e.clientY - rect.top - size / 2) + "px";
      btn.appendChild(ripple);
      setTimeout(() => ripple.remove(), 650);

      setStatus("Connecting to Google...");
      btn.disabled = true;

      try {
        const result = await signInWithPopup(auth, provider);
        const email = result.user.email;

        if (email !== ALLOWED_EMAIL) {
          await auth.signOut();
          setStatus("This account is not authorized.", true);
          btn.disabled = false;
          return;
        }

        const idToken = await result.user.getIdToken();
        const res = await fetch("/auth/session", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ idToken }),
        });

        if (!res.ok) {
          throw new Error("Session creation failed");
        }

        setStatus("Signed in. Redirecting...");
        window.location.href = "/dashboard.html";
      } catch (err) {
        console.error(err);
        setStatus("Sign-in failed. Try again.", true);
        btn.disabled = false;
      }
    });

    onAuthStateChanged(auth, (user) => {
      if (user && user.email === ALLOWED_EMAIL) {
        fetch("/auth/verify", { credentials: "include" })
          .then((r) => (r.ok ? (window.location.href = "/dashboard.html") : null))
          .catch(() => {});
      }
    });

    const field = document.getElementById("field");
    for (let i = 0; i < 40; i++) {
      const dot = document.createElement("span");
      dot.style.left = Math.random() * 100 + "%";
      dot.style.setProperty("--dx", (Math.random() * 40 - 20) + "px");
      dot.style.animationDelay = (Math.random() * 14) + "s";
      dot.style.animationDuration = (10 + Math.random() * 8) + "s";
      field.appendChild(dot);
    }
  </script>
</body>
</html>
