<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AMD Dashboard</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --panel-strong: #f0f2f4;
    --border: rgba(15, 23, 32, 0.08);
    --border-strong: rgba(15, 23, 32, 0.18);
    --text: #14181d;
    --text-dim: #6b7280;
    --accent: #0f9e8f;
    --accent-bg: rgba(15, 158, 143, 0.08);
    --danger: #d64545;
    --danger-bg: rgba(214, 69, 69, 0.08);
    --warn: #b3801f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
  }

  body {
    padding: 24px 16px 60px;
  }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
    opacity: 0;
    animation: fadein 0.5s ease forwards;
    position: relative;
    z-index: 100;
  }

  .logo {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .logo span {
    color: var(--text-dim);
    font-weight: 400;
    font-size: 13px;
    letter-spacing: 0.06em;
    display: block;
    margin-top: 2px;
  }
  .avatar-wrap {
    position: relative;
  }

  .avatar-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--panel-strong);
    border: 1px solid var(--border);
    cursor: pointer;
    padding: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.2s ease;
  }

  .avatar-btn:hover { border-color: var(--border-strong); }

  .avatar-btn img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .avatar-btn .initials {
    font-size: 15px;
    font-weight: 600;
    color: var(--accent);
  }

  .dropdown {
    position: absolute;
    top: 50px;
    right: 0;
    width: 240px;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 12px 32px rgba(15, 23, 32, 0.18), 0 2px 8px rgba(15, 23, 32, 0.08);
    padding: 16px;
    z-index: 60;
    opacity: 0;
    transform: translateY(-6px);
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .dropdown.open {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .dropdown .dd-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 14px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

  .dropdown .dd-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    overflow: hidden;
    background: var(--panel-strong);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .dropdown .dd-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .dropdown .dd-avatar .initials { font-size: 14px; font-weight: 600; color: var(--accent); }

  .dropdown .dd-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
  }

  .dropdown .dd-email {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.3;
    word-break: break-all;
  }

  .dd-item {
    width: 100%;
    text-align: left;
    padding: 10px 10px;
    border-radius: 10px;
    background: none;
    border: none;
    color: var(--text);
    font-size: 13.5px;
    font-family: inherit;
    cursor: pointer;
    display: block;
  }

  .dd-item:hover { background: rgba(15, 23, 32, 0.06); }
  .dd-item.danger { color: var(--danger); }
  .panel {
    border-radius: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    box-shadow: 0 4px 20px rgba(15, 23, 32, 0.04);
    padding: 24px;
    margin-bottom: 16px;
    opacity: 0;
    transform: translateY(10px);
    animation: rise 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    position: relative;
    z-index: 1;
  }

  .panel:nth-of-type(1) { animation-delay: 0.05s; }
  .panel:nth-of-type(2) { animation-delay: 0.12s; }
  .panel:nth-of-type(3) { animation-delay: 0.19s; }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadein {
    to { opacity: 1; }
  }

  .panel-title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-dim);
    display: inline-block;
    margin-right: 8px;
    flex-shrink: 0;
    transition: background 0.3s ease;
  }

  .dot.online { background: var(--accent); }
  .dot.offline { background: var(--danger); }
  .dot.pending { background: var(--warn); }

  .state-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 15px;
  }

  .state-left { display: flex; align-items: center; }

  .uptime {
    font-size: 12.5px;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
  }
  .add-user-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .add-user-row input {
    flex: 1;
    min-width: 120px;
    padding: 13px 14px;
    border-radius: 12px;
    background: var(--panel-strong);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.25s ease;
  }

  .add-user-row input:focus { border-color: var(--border-strong); }
  .add-user-row input::placeholder { color: rgba(107,114,128,0.6); }

  .primary-btn {
    padding: 13px 22px;
    border-radius: 12px;
    background: var(--accent);
    border: none;
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: opacity 0.25s ease, transform 0.15s ease;
  }

  .primary-btn:hover { opacity: 0.9; }
  .primary-btn:active { transform: scale(0.97); }
  .primary-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    transform: scale(0);
    animation: rippleAnim 0.6s ease-out;
    pointer-events: none;
  }
  @keyframes rippleAnim { to { transform: scale(3.2); opacity: 0; } }
  .search-row {
    margin-bottom: 16px;
  }

  .search-row input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    background: var(--panel-strong);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.25s ease;
  }

  .search-row input:focus { border-color: var(--border-strong); }
  .user-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 480px;
    overflow-y: auto;
  }

  .user-card {
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    background: var(--panel-strong);
  }

  .user-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .user-id {
    display: flex;
    align-items: center;
    min-width: 0;
  }

  .user-text { min-width: 0; }

  .user-name {
    font-size: 14.5px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .user-phone {
    font-size: 12.5px;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    margin-top: 2px;
  }

  .badge {
    font-size: 11px;
    font-weight: 600;
    padding: 4px 9px;
    border-radius: 8px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    flex-shrink: 0;
  }

  .badge.banned { background: var(--danger-bg); color: var(--danger); }

  .user-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  .mini-btn {
    padding: 8px 12px;
    border-radius: 9px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 12.5px;
    font-family: inherit;
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  .mini-btn:hover { border-color: var(--border-strong); }
  .mini-btn.danger { color: var(--danger); }
  .mini-btn.danger:hover { background: var(--danger-bg); border-color: var(--danger); }
  .mini-btn.warn { color: var(--warn); }
  .mini-btn.accent { color: var(--accent); }
  .mini-btn.accent:hover { background: var(--accent-bg); border-color: var(--accent); }

  .user-pair-area {
    margin-top: 12px;
    display: none;
  }

  .user-pair-area.open { display: block; }

  .login-options {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }

  .opt-btn {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 12.5px;
    font-family: inherit;
    cursor: pointer;
    transition: border-color 0.25s ease, background 0.25s ease;
  }

  .opt-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-bg);
  }

  #qrBox-tpl img {
    border-radius: 12px;
    border: 1px solid var(--border);
    width: 200px;
    height: 200px;
  }

  .code-display {
    margin-top: 12px;
    text-align: center;
    padding: 18px;
    border-radius: 12px;
    background: var(--accent-bg);
    border: 1px solid rgba(15, 158, 143, 0.25);
  }

  .code-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .code-display .code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--accent);
  }

  .copy-btn {
    padding: 6px 10px;
    border-radius: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
  }

  .copy-btn:hover { border-color: var(--border-strong); color: var(--text); }

  .code-display .hint {
    margin-top: 10px;
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.6;
  }

  .qr-box {
    margin-top: 12px;
    display: flex;
    justify-content: center;
  }

  .empty {
    text-align: center;
    padding: 24px 0;
    color: var(--text-dim);
    font-size: 13.5px;
  }

  .hidden { display: none !important; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%) translateY(10px);
    background: var(--text);
    color: #fff;
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    opacity: 0;
    transition: opacity 0.3s ease, transform 0.3s ease;
    pointer-events: none;
    z-index: 80;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; }

  .btn-spinner {
    display: inline-block;
    width: 13px;
    height: 13px;
    border: 2px solid rgba(255, 255, 255, 0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.65s linear infinite;
    vertical-align: -2px;
  }

  .mini-btn .btn-spinner,
  .opt-btn .btn-spinner,
  .copy-btn .btn-spinner {
    border: 2px solid rgba(15, 23, 32, 0.15);
    border-top-color: var(--text-dim);
  }

  .mini-btn.danger .btn-spinner { border-top-color: var(--danger); }
  .mini-btn.warn .btn-spinner { border-top-color: var(--warn); }
  .mini-btn.accent .btn-spinner { border-top-color: var(--accent); }
  .confirm-ok .btn-spinner { border-top-color: #fff; }

  @keyframes spin { to { transform: rotate(360deg); } }

  button.is-loading {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    cursor: wait;
    opacity: 0.85;
  }

  button.is-loading:disabled { cursor: wait; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 32, 0.45);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    animation: overlayFade 0.18s ease forwards;
    padding: 20px;
  }

  @keyframes overlayFade { to { opacity: 1; } }

  .confirm-box {
    background: #ffffff;
    border-radius: 18px;
    padding: 22px;
    width: min(320px, 100%);
    box-shadow: 0 20px 60px rgba(15, 23, 32, 0.25);
    transform: translateY(8px) scale(0.98);
    animation: confirmRise 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes confirmRise { to { transform: translateY(0) scale(1); } }

  .confirm-box .confirm-title {
    font-size: 15.5px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 8px;
  }

  .confirm-box .confirm-msg {
    font-size: 13.5px;
    color: var(--text-dim);
    line-height: 1.5;
    margin-bottom: 20px;
  }

  .confirm-box .confirm-actions {
    display: flex;
    gap: 10px;
  }

  .confirm-box .confirm-actions button {
    flex: 1;
    padding: 11px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel-strong);
    color: var(--text);
    font-size: 13.5px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }

  .confirm-box .confirm-actions .confirm-ok {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
  }

  .confirm-box .confirm-actions .confirm-ok.warn-btn {
    background: var(--warn);
    border-color: var(--warn);
  }
</style>
</head>
<body>

  <div class="wrap">
    <header>
      <div class="logo">AMD<span>Control Panel</span></div>
      <div class="avatar-wrap">
        <button class="avatar-btn" id="avatarBtn">
          <span class="initials" id="avatarInitials">?</span>
          <img id="avatarImg" class="hidden" alt="" />
        </button>
        <div class="dropdown" id="dropdown">
          <div class="dd-header">
            <div class="dd-avatar">
              <span class="initials" id="ddInitials">?</span>
              <img id="ddImg" class="hidden" alt="" />
            </div>
            <div>
              <div class="dd-name" id="ddName">-</div>
              <div class="dd-email" id="ddEmail">-</div>
            </div>
          </div>
          <button class="dd-item" id="accountsBtn">Accounts</button>
          <button class="dd-item danger" id="signOutBtn">Sign out</button>
        </div>
      </div>
    </header>

    <div class="panel">
      <div class="panel-title">Server</div>
      <div class="state-row">
        <div class="state-left">
          <span class="dot online"></span>
          <span>Server running</span>
        </div>
        <span class="uptime" id="uptimeText">-</span>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Add User</div>
      <div class="add-user-row">
        <input type="text" id="newName" placeholder="Name" />
        <input type="text" id="newPhone" placeholder="8801XXXXXXXXX" inputmode="numeric" />
        <button class="primary-btn" id="addUserBtn">Add</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">
        Users
        <button class="mini-btn" id="clearLogsBtn">Clear Logs</button>
      </div>
      <div class="search-row">
        <input type="text" id="searchInput" placeholder="Search by name or number..." />
      </div>
      <div class="user-list" id="userList">
        <div class="empty">No users yet. Add one above.</div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { firebaseConfig, ALLOWED_EMAIL } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (!user || user.email !== ALLOWED_EMAIL) {
        window.location.href = "/index.html";
        return;
      }
      renderAccount(user);
    });

    function initialsFrom(nameOrEmail) {
      if (!nameOrEmail) return "?";
      const parts = nameOrEmail.trim().split(/\s+/);
      if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
      return nameOrEmail.slice(0, 2).toUpperCase();
    }

    function renderAccount(user) {
      const name = user.displayName || user.email;
      const photo = user.photoURL;

      document.getElementById("ddName").textContent = user.displayName || "Admin";
      document.getElementById("ddEmail").textContent = user.email;

      const setAvatar = (imgId, initialsId) => {
        const img = document.getElementById(imgId);
        const initials = document.getElementById(initialsId);
        if (photo) {
          img.src = photo;
          img.classList.remove("hidden");
          initials.classList.add("hidden");
        } else {
          initials.textContent = initialsFrom(name);
          initials.classList.remove("hidden");
          img.classList.add("hidden");
        }
      };
      setAvatar("avatarImg", "avatarInitials");
      setAvatar("ddImg", "ddInitials");
    }
    const avatarBtn = document.getElementById("avatarBtn");
    const dropdown = document.getElementById("dropdown");
    avatarBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      dropdown.classList.toggle("open");
    });
    document.addEventListener("click", (e) => {
      if (!dropdown.contains(e.target) && e.target !== avatarBtn) {
        dropdown.classList.remove("open");
      }
    });

    document.getElementById("accountsBtn").addEventListener("click", () => {
      dropdown.classList.remove("open");
      document.getElementById("dd-account-overlay")?.remove();
      const overlay = document.createElement("div");
      overlay.id = "dd-account-overlay";
      overlay.className = "modal-overlay";
      const name = document.getElementById("ddName").textContent;
      const email = document.getElementById("ddEmail").textContent;
      overlay.innerHTML = `
        <div class="confirm-box" style="text-align:center;">
          <div style="font-size:15px;font-weight:600;margin-bottom:4px;">${name}</div>
          <div style="font-size:13px;color:#6b7280;margin-bottom:18px;">${email}</div>
          <button id="closeAccountInfo" style="padding:10px 20px;border-radius:10px;background:#0f9e8f;border:none;color:#fff;font-size:13px;font-weight:600;cursor:pointer;width:100%;">Close</button>
        </div>
      `;
      document.body.appendChild(overlay);
      const close = () => overlay.remove();
      document.getElementById("closeAccountInfo").addEventListener("click", close);
      overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });
    });

    function confirmModal({ title, message, okLabel = "Confirm", danger = true }) {
      return new Promise((resolve) => {
        const overlay = document.createElement("div");
        overlay.className = "modal-overlay";
        overlay.innerHTML = `
          <div class="confirm-box">
            <div class="confirm-title">${title}</div>
            <div class="confirm-msg">${message}</div>
            <div class="confirm-actions">
              <button data-choice="cancel">Cancel</button>
              <button data-choice="ok" class="confirm-ok ${danger ? '' : 'warn-btn'}">${okLabel}</button>
            </div>
          </div>
        `;
        document.body.appendChild(overlay);
        const cleanup = (result) => { overlay.remove(); resolve(result); };
        overlay.querySelector('[data-choice="cancel"]').addEventListener("click", () => cleanup(false));
        overlay.querySelector('[data-choice="ok"]').addEventListener("click", (e) => {
          setBtnLoading(e.currentTarget, true);
          overlay.querySelector('[data-choice="cancel"]').disabled = true;
          cleanup(true);
        });
        overlay.addEventListener("click", (e) => { if (e.target === overlay) cleanup(false); });
      });
    }

    document.getElementById("signOutBtn").addEventListener("click", async (e) => {
      setBtnLoading(e.currentTarget, true, "Signing out...");
      await fetch("/auth/logout", { method: "POST", credentials: "include" });
      await signOut(auth);
      window.location.href = "/index.html";
    });
    function toast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2600);
    }

    let sessionExpiredHandled = false;
    function handleSessionExpired() {
      if (sessionExpiredHandled) return;
      sessionExpiredHandled = true;
      toast("Session expired. Redirecting to login...");
      setTimeout(() => { window.location.href = "/index.html"; }, 1200);
    }

    function setBtnLoading(btn, isLoading, loadingLabel) {
      if (!btn) return;
      if (isLoading) {
        if (btn.dataset.origLabel === undefined) btn.dataset.origLabel = btn.textContent;
        btn.disabled = true;
        btn.classList.add("is-loading");
        btn.innerHTML = `<span class="btn-spinner"></span>${loadingLabel ? `<span>${loadingLabel}</span>` : ""}`;
      } else {
        btn.disabled = false;
        btn.classList.remove("is-loading");
        btn.textContent = btn.dataset.origLabel !== undefined ? btn.dataset.origLabel : btn.textContent;
        delete btn.dataset.origLabel;
      }
    }

    function addRipple(btn, e) {
      const rect = btn.getBoundingClientRect();
      const ripple = document.createElement("span");
      ripple.className = "ripple";
      const size = Math.max(rect.width, rect.height);
      ripple.style.width = ripple.style.height = size + "px";
      ripple.style.left = (e.clientX - rect.left - size / 2) + "px";
      ripple.style.top = (e.clientY - rect.top - size / 2) + "px";
      btn.style.position = btn.style.position || "relative";
      btn.appendChild(ripple);
      setTimeout(() => ripple.remove(), 650);
    }
    function formatUptime(seconds) {
      const d = Math.floor(seconds / 86400);
      const h = Math.floor((seconds % 86400) / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = Math.floor(seconds % 60);
      if (d > 0) return `${d}d ${h}h ${m}m`;
      if (h > 0) return `${h}h ${m}m ${s}s`;
      if (m > 0) return `${m}m ${s}s`;
      return `${s}s`;
    }

    async function refreshUptime() {
      try {
        const res = await fetch("/api/server-info", { credentials: "include" });
        if (res.status === 401) { handleSessionExpired(); return; }
        if (!res.ok) return;
        const data = await res.json();
        if (typeof data.uptimeSeconds !== "number") return;
        document.getElementById("uptimeText").textContent = "Uptime: " + formatUptime(data.uptimeSeconds);
      } catch (err) {}
    }
    document.getElementById("addUserBtn").addEventListener("click", async (e) => {
      addRipple(e.currentTarget, e);
      const btn = e.currentTarget;
      const name = document.getElementById("newName").value.trim();
      const phone = document.getElementById("newPhone").value.replace(/[^0-9]/g, "");
      if (!name) { toast("Enter a name"); return; }
      if (phone.length < 8) { toast("Enter a valid number"); return; }
      setBtnLoading(btn, true, "Adding...");
      try {
        const res = await fetch("/api/users", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ name, phone }),
        });
        if (res.status === 401) { handleSessionExpired(); return; }
        const data = await res.json();
        if (data.ok) {
          document.getElementById("newName").value = "";
          document.getElementById("newPhone").value = "";
          toast("User added");
          refreshUsers();
        } else {
          toast(data.error || "Failed to add user");
        }
      } catch (err) {
        toast("Request failed");
      } finally {
        setBtnLoading(btn, false);
      }
    });
    let searchTimer = null;
    document.getElementById("searchInput").addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(refreshUsers, 250);
    });
    document.getElementById("clearLogsBtn").addEventListener("click", async (e) => {
      const btn = e.currentTarget;
      setBtnLoading(btn, true);
      try {
        await fetch("/api/logs/clear", { method: "POST", credentials: "include" });
        toast("Logs cleared");
      } finally {
        setBtnLoading(btn, false);
      }
    });
    const openPairAreas = new Set();
    const selectedMethod = {};
    const activeCode = {};
    const activeQr = {};

    function userCardHtml(u) {
      const statusDot = u.banned ? "offline" : (u.connected ? "online" : "offline");
      const statusText = u.banned ? "Banned" : (u.connected ? "Connected" : "Disconnected");
      const method = selectedMethod[u.id] || "pairing";
      const isOpen = openPairAreas.has(u.id);
      const code = activeCode[u.id];
      const qr = activeQr[u.id];

      return `
        <div class="user-card" data-id="${u.id}">
          <div class="user-top">
            <div class="user-id">
              <span class="dot ${statusDot}"></span>
              <div class="user-text">
                <div class="user-name">${escapeHtml(u.name)}</div>
                <div class="user-phone">${escapeHtml(u.phone)} &middot; ${statusText}</div>
              </div>
            </div>
            ${u.banned ? '<span class="badge banned">Banned</span>' : ''}
          </div>

          <div class="user-actions">
            ${!u.banned && !u.connected ? `<button class="mini-btn accent" data-action="toggle-pair">Connect</button>` : ''}
            ${u.connected ? `<button class="mini-btn danger" data-action="disconnect">Disconnect</button>` : ''}
            ${!u.banned && u.connected ? `<button class="mini-btn warn" data-action="ban">Ban</button>` : ''}
            ${u.banned ? `<button class="mini-btn accent" data-action="unban">Unban</button>` : ''}
            <button class="mini-btn danger" data-action="remove">Remove</button>
          </div>

          <div class="user-pair-area ${isOpen ? 'open' : ''}" data-pair-area>
            <div class="login-options">
              <button class="opt-btn ${method === 'pairing' ? 'active' : ''}" data-method="pairing">Pairing Code</button>
              <button class="opt-btn ${method === 'qr' ? 'active' : ''}" data-method="qr">QR Code</button>
            </div>
            <div data-pair-form class="${method === 'pairing' ? '' : 'hidden'}">
              <div style="margin-top:10px;">
                <button class="primary-btn" data-action="get-code" style="width:100%;">Get Code</button>
              </div>
            </div>
            <div data-qr-form class="${method === 'qr' ? '' : 'hidden'}">
              <div style="margin-top:10px;">
                <button class="primary-btn" data-action="get-qr" style="width:100%;">Generate QR</button>
              </div>
            </div>
            <div class="code-display ${code ? '' : 'hidden'}" data-code-display>
              <div class="code-row">
                <span class="code" data-code-text>${code || '------'}</span>
                <button class="copy-btn" data-action="copy-code">Copy</button>
              </div>
              <div class="hint">Enter this code in WhatsApp<br />Linked Devices &gt; Link with phone number</div>
            </div>
            <div class="qr-box ${qr ? '' : 'hidden'}" data-qr-box>${qr ? `<img src="${qr}" alt="QR Code" />` : ''}</div>
          </div>
        </div>
      `;
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    async function refreshUsers() {
      const q = document.getElementById("searchInput").value.trim();
      try {
        const res = await fetch("/api/users" + (q ? `?q=${encodeURIComponent(q)}` : ""), { credentials: "include" });
        if (res.status === 401) { handleSessionExpired(); return; }
        const data = await res.json();
        renderUsers(data.users || []);
      } catch (err) {}
    }

    function renderUsers(users) {
      const list = document.getElementById("userList");
      users.forEach((u) => {
        if (u.connected) {
          delete activeCode[u.id];
          delete activeQr[u.id];
          openPairAreas.delete(u.id);
        }
      });
      if (!users.length) {
        list.innerHTML = '<div class="empty">No users found.</div>';
        return;
      }
      list.innerHTML = users.map(userCardHtml).join("");
    }

    document.getElementById("userList").addEventListener("click", async (e) => {
      const card = e.target.closest(".user-card");
      if (!card) return;
      const id = card.dataset.id;
      const action = e.target.dataset.action;
      const method = e.target.dataset.method;

      if (method) {
        selectedMethod[id] = method;
        delete activeCode[id];
        delete activeQr[id];
        card.querySelectorAll(".opt-btn").forEach((b) => b.classList.toggle("active", b.dataset.method === method));
        card.querySelector("[data-pair-form]").classList.toggle("hidden", method !== "pairing");
        card.querySelector("[data-qr-form]").classList.toggle("hidden", method !== "qr");
        card.querySelector("[data-code-display]").classList.add("hidden");
        card.querySelector("[data-qr-box]").classList.add("hidden");
        return;
      }

      if (!action) return;
      addRipple(e.target, e);

      if (action === "toggle-pair") {
        const area = card.querySelector("[data-pair-area]");
        const willOpen = !area.classList.contains("open");
        area.classList.toggle("open", willOpen);
        if (willOpen) openPairAreas.add(id); else openPairAreas.delete(id);
        return;
      }

      if (action === "get-code") {
        const btn = e.target;
        setBtnLoading(btn, true, "Getting code...");
        try {
          const res = await fetch(`/api/users/${id}/pair`, { method: "POST", credentials: "include" });
          const data = await res.json();
          if (data.code) {
            activeCode[id] = data.code;
            card.querySelector("[data-code-text]").textContent = data.code;
            card.querySelector("[data-code-display]").classList.remove("hidden");
          } else {
            toast(data.error || "Failed to get code");
          }
        } catch (err) {
          toast("Request failed");
        } finally {
          setBtnLoading(btn, false);
        }
        return;
      }

      if (action === "copy-code") {
        const btn = e.target;
        const codeText = card.querySelector("[data-code-text]").textContent;
        setBtnLoading(btn, true);
        try {
          await navigator.clipboard.writeText(codeText);
          toast("Code copied");
        } catch (err) {
          toast("Could not copy");
        } finally {
          setBtnLoading(btn, false);
        }
        return;
      }

      if (action === "get-qr") {
        const box = card.querySelector("[data-qr-box]");
        const btn = e.target;
        setBtnLoading(btn, true, "Generating...");
        box.classList.remove("hidden");
        box.innerHTML = '<div class="empty" style="padding:12px;"><span class="btn-spinner" style="border-color:rgba(15,23,32,0.15);border-top-color:var(--text-dim);"></span> Generating QR code...</div>';
        try {
          const res = await fetch(`/api/users/${id}/qr`, { credentials: "include" });
          const data = await res.json();
          if (data.qr) {
            activeQr[id] = data.qr;
            box.innerHTML = `<img src="${data.qr}" alt="QR Code" />`;
          } else {
            delete activeQr[id];
            box.innerHTML = '';
            box.classList.add("hidden");
            toast(data.error || "Failed to generate QR, try again");
          }
        } catch (err) {
          delete activeQr[id];
          box.innerHTML = '';
          box.classList.add("hidden");
          toast("Request failed");
        } finally {
          setBtnLoading(btn, false);
        }
        return;
      }

      if (action === "disconnect") {
        const btn = e.target;
        setBtnLoading(btn, true, "Disconnecting...");
        try {
          await fetch(`/api/users/${id}/disconnect`, { method: "POST", credentials: "include" });
          toast("Disconnected");
          setTimeout(refreshUsers, 800);
        } finally {
          setTimeout(() => setBtnLoading(btn, false), 800);
        }
        return;
      }

      if (action === "ban") {
        const ok = await confirmModal({
          title: "Ban this user?",
          message: "They will be disconnected and blocked from using the bot.",
          okLabel: "Ban",
          danger: false,
        });
        if (!ok) return;
        const btn = e.target;
        setBtnLoading(btn, true, "Banning...");
        try {
          await fetch(`/api/users/${id}/ban`, { method: "POST", credentials: "include" });
          toast("User banned");
          refreshUsers();
        } finally {
          setBtnLoading(btn, false);
        }
        return;
      }

      if (action === "unban") {
        const btn = e.target;
        setBtnLoading(btn, true, "Unbanning...");
        try {
          await fetch(`/api/users/${id}/unban`, { method: "POST", credentials: "include" });
          toast("User unbanned");
          refreshUsers();
        } finally {
          setBtnLoading(btn, false);
        }
        return;
      }

      if (action === "remove") {
        const ok = await confirmModal({
          title: "Remove this user?",
          message: "This will delete the user entirely and cannot be undone.",
          okLabel: "Remove",
          danger: true,
        });
        if (!ok) return;
        const btn = e.target;
        setBtnLoading(btn, true, "Removing...");
        try {
          await fetch(`/api/users/${id}`, { method: "DELETE", credentials: "include" });
          toast("User removed");
          refreshUsers();
        } finally {
          setBtnLoading(btn, false);
        }
        return;
      }
    });

    refreshUsers();
    refreshUptime();
    setInterval(refreshUsers, 5000);
    setInterval(refreshUptime, 5000);
  </script>
</body>
</html>
