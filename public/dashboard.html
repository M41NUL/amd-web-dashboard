<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AMD Dashboard</title>
<style>
  :root {
    --bg: #0a0b0d;
    --panel: rgba(255, 255, 255, 0.04);
    --panel-strong: rgba(255, 255, 255, 0.07);
    --border: rgba(255, 255, 255, 0.09);
    --border-strong: rgba(255, 255, 255, 0.2);
    --text: #eef0f2;
    --text-dim: #8b9096;
    --accent: #4fd1c5;
    --danger: #e0655b;
    --warn: #d9a441;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
  }

  body {
    padding: 24px 16px 60px;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
    opacity: 0;
    animation: fadein 0.5s ease forwards;
  }

  .logo {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .logo span {
    color: var(--text-dim);
    font-weight: 400;
    font-size: 13px;
    letter-spacing: 0.06em;
    display: block;
    margin-top: 2px;
  }

  .signout {
    padding: 9px 16px;
    border-radius: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    transition: border-color 0.25s ease, color 0.25s ease;
  }

  .signout:hover {
    border-color: var(--border-strong);
    color: var(--text);
  }

  .panel {
    border-radius: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    backdrop-filter: blur(24px) saturate(140%);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
    padding: 24px;
    margin-bottom: 16px;
    opacity: 0;
    transform: translateY(10px);
    animation: rise 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .panel:nth-of-type(1) { animation-delay: 0.05s; }
  .panel:nth-of-type(2) { animation-delay: 0.12s; }
  .panel:nth-of-type(3) { animation-delay: 0.19s; }
  .panel:nth-of-type(4) { animation-delay: 0.26s; }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadein {
    to { opacity: 1; }
  }

  .panel-title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-dim);
    display: inline-block;
    margin-right: 8px;
    transition: background 0.3s ease;
  }

  .dot.online { background: var(--accent); }
  .dot.offline { background: var(--danger); }
  .dot.pending { background: var(--warn); }

  .state-row {
    display: flex;
    align-items: center;
    font-size: 15px;
  }

  .kv {
    display: grid;
    grid-template-columns: 110px 1fr;
    gap: 10px 12px;
    font-size: 14px;
    margin-top: 16px;
  }

  .kv .k { color: var(--text-dim); }
  .kv .v { font-family: 'JetBrains Mono', monospace; font-size: 13px; word-break: break-all; }

  .login-options {
    display: flex;
    gap: 12px;
    margin-top: 4px;
  }

  .opt-btn {
    flex: 1;
    padding: 14px;
    border-radius: 14px;
    background: var(--panel-strong);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: border-color 0.25s ease, background 0.25s ease, transform 0.15s ease;
  }

  .opt-btn:hover { border-color: var(--border-strong); background: rgba(255,255,255,0.1); }
  .opt-btn:active { transform: scale(0.97); }

  .opt-btn.active {
    border-color: var(--accent);
    color: var(--accent);
  }

  .phone-row {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }

  .phone-row input {
    flex: 1;
    padding: 13px 14px;
    border-radius: 12px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 14px;
    font-family: 'JetBrains Mono', monospace;
    outline: none;
    transition: border-color 0.25s ease;
  }

  .phone-row input:focus { border-color: var(--border-strong); }
  .phone-row input::placeholder { color: rgba(139,144,150,0.5); }

  .primary-btn {
    padding: 13px 22px;
    border-radius: 12px;
    background: var(--accent);
    border: none;
    color: #06110f;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: opacity 0.25s ease, transform 0.15s ease;
  }

  .primary-btn:hover { opacity: 0.88; }
  .primary-btn:active { transform: scale(0.97); }
  .primary-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    transform: scale(0);
    animation: rippleAnim 0.6s ease-out;
    pointer-events: none;
  }
  @keyframes rippleAnim { to { transform: scale(3.2); opacity: 0; } }

  .code-display {
    margin-top: 18px;
    text-align: center;
    padding: 22px;
    border-radius: 14px;
    background: rgba(79, 209, 197, 0.06);
    border: 1px solid rgba(79, 209, 197, 0.25);
  }

  .code-display .code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--accent);
  }

  .code-display .hint {
    margin-top: 10px;
    font-size: 12.5px;
    color: var(--text-dim);
    line-height: 1.6;
  }

  #qrBox {
    margin-top: 18px;
    display: flex;
    justify-content: center;
  }

  #qrBox img {
    border-radius: 12px;
    border: 1px solid var(--border);
    width: 220px;
    height: 220px;
  }

  .action-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .action-btn {
    padding: 14px;
    border-radius: 12px;
    background: var(--panel-strong);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 13.5px;
    font-family: inherit;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: border-color 0.25s ease, background 0.25s ease, transform 0.15s ease;
  }

  .action-btn:hover { border-color: var(--border-strong); }
  .action-btn:active { transform: scale(0.97); }
  .action-btn.danger:hover { border-color: rgba(224,101,91,0.5); color: var(--danger); }

  .log-list {
    margin-top: 4px;
    max-height: 280px;
    overflow-y: auto;
  }

  .log-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13.5px;
  }

  .log-item:last-child { border-bottom: none; }

  .log-item .plat { text-transform: capitalize; }
  .log-item .time { color: var(--text-dim); font-family: 'JetBrains Mono', monospace; font-size: 12px; }

  .badge {
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 20px;
    border: 1px solid var(--border);
  }

  .badge.success { color: var(--accent); border-color: rgba(79,209,197,0.35); }
  .badge.failed { color: var(--danger); border-color: rgba(224,101,91,0.35); }

  .empty {
    text-align: center;
    padding: 30px 0;
    color: var(--text-dim);
    font-size: 13.5px;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    padding: 12px 20px;
    border-radius: 12px;
    background: rgba(20,22,25,0.9);
    border: 1px solid var(--border-strong);
    backdrop-filter: blur(20px);
    font-size: 13.5px;
    opacity: 0;
    transition: opacity 0.3s ease, transform 0.3s ease;
    pointer-events: none;
    z-index: 50;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .hidden { display: none !important; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; }
</style>
</head>
<body>

  <div class="wrap">
    <header>
      <div class="logo">AMD<span>Control Panel</span></div>
      <button class="signout" id="signOutBtn">Sign out</button>
    </header>

    <div class="panel">
      <div class="panel-title">Connection</div>
      <div class="state-row">
        <span class="dot offline" id="statusDot"></span>
        <span id="statusText">Checking status...</span>
      </div>
      <div class="kv hidden" id="accountInfo">
        <span class="k">Account</span><span class="v" id="accountId">-</span>
        <span class="k">Downloads</span><span class="v" id="downloadCount">0</span>
      </div>
    </div>

    <div class="panel" id="loginPanel">
      <div class="panel-title">Connect WhatsApp</div>
      <div class="login-options">
        <button class="opt-btn active" data-method="pairing">Pairing Code</button>
        <button class="opt-btn" data-method="qr">QR Code</button>
      </div>

      <div id="pairingForm">
        <div class="phone-row">
          <input type="text" id="phoneInput" placeholder="8801XXXXXXXXX" inputmode="numeric" />
          <button class="primary-btn" id="requestCodeBtn">Get Code</button>
        </div>
      </div>

      <div id="qrForm" class="hidden">
        <div style="margin-top:16px;">
          <button class="primary-btn" id="requestQrBtn" style="width:100%;">Generate QR</button>
        </div>
      </div>

      <div class="code-display hidden" id="codeDisplay">
        <div class="code" id="pairingCodeText">------</div>
        <div class="hint">Enter this code in WhatsApp<br />Linked Devices &gt; Link with phone number</div>
      </div>

      <div id="qrBox" class="hidden"></div>
    </div>

    <div class="panel hidden" id="controlPanel">
      <div class="panel-title">Bot Control</div>
      <div class="action-grid">
        <button class="action-btn" id="reconnectBtn">Reconnect</button>
        <button class="action-btn danger" id="disconnectBtn">Disconnect</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">
        Download Logs
        <button class="action-btn" id="clearLogsBtn" style="padding:6px 12px; font-size:12px;">Clear</button>
      </div>
      <div class="log-list" id="logList">
        <div class="empty">No downloads yet.</div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBmdLTY_IIH4nykxRDKaPLX4rCVIuBSoS4",
      authDomain: "amd-whatsapp-bot.firebaseapp.com",
      projectId: "amd-whatsapp-bot",
      storageBucket: "amd-whatsapp-bot.firebasestorage.app",
      messagingSenderId: "223251809936",
      appId: "1:223251809936:web:919baaad02f13762baba15"
    };

    const ALLOWED_EMAIL = "devmainulislam@gmail.com";
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (!user || user.email !== ALLOWED_EMAIL) {
        window.location.href = "/index.html";
      }
    });

    document.getElementById("signOutBtn").addEventListener("click", async () => {
      await fetch("/auth/logout", { method: "POST", credentials: "include" });
      await signOut(auth);
      window.location.href = "/index.html";
    });

    function toast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2600);
    }

    function addRipple(btn, e) {
      const rect = btn.getBoundingClientRect();
      const ripple = document.createElement("span");
      ripple.className = "ripple";
      const size = Math.max(rect.width, rect.height);
      ripple.style.width = ripple.style.height = size + "px";
      ripple.style.left = (e.clientX - rect.left - size / 2) + "px";
      ripple.style.top = (e.clientY - rect.top - size / 2) + "px";
      btn.style.position = btn.style.position || "relative";
      btn.appendChild(ripple);
      setTimeout(() => ripple.remove(), 650);
    }

    document.querySelectorAll("button").forEach((b) => {
      b.addEventListener("click", (e) => addRipple(b, e));
    });

    const methodBtns = document.querySelectorAll(".opt-btn");
    let selectedMethod = "pairing";
    methodBtns.forEach((btn) => {
      btn.addEventListener("click", () => {
        methodBtns.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        selectedMethod = btn.dataset.method;
        document.getElementById("pairingForm").classList.toggle("hidden", selectedMethod !== "pairing");
        document.getElementById("qrForm").classList.toggle("hidden", selectedMethod !== "qr");
        document.getElementById("codeDisplay").classList.add("hidden");
        document.getElementById("qrBox").classList.add("hidden");
      });
    });

    document.getElementById("requestCodeBtn").addEventListener("click", async () => {
      const phone = document.getElementById("phoneInput").value.replace(/[^0-9]/g, "");
      if (phone.length < 8) {
        toast("Enter a valid number");
        return;
      }
      try {
        const res = await fetch("/api/pair", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ phone }),
        });
        const data = await res.json();
        if (data.code) {
          document.getElementById("pairingCodeText").textContent = data.code;
          document.getElementById("codeDisplay").classList.remove("hidden");
        } else {
          toast(data.error || "Failed to get code");
        }
      } catch (err) {
        toast("Request failed");
      }
    });

    document.getElementById("requestQrBtn").addEventListener("click", async () => {
      try {
        const res = await fetch("/api/qr", { credentials: "include" });
        const data = await res.json();
        if (data.qr) {
          const box = document.getElementById("qrBox");
          box.innerHTML = `<img src="${data.qr}" alt="QR Code" />`;
          box.classList.remove("hidden");
        } else {
          toast(data.error || "Failed to generate QR");
        }
      } catch (err) {
        toast("Request failed");
      }
    });

    document.getElementById("reconnectBtn").addEventListener("click", async () => {
      await fetch("/api/reconnect", { method: "POST", credentials: "include" });
      toast("Reconnecting...");
      setTimeout(refreshStatus, 1500);
    });

    document.getElementById("disconnectBtn").addEventListener("click", async () => {
      await fetch("/api/disconnect", { method: "POST", credentials: "include" });
      toast("Disconnected");
      setTimeout(refreshStatus, 1000);
    });

    document.getElementById("clearLogsBtn").addEventListener("click", async () => {
      await fetch("/api/logs/clear", { method: "POST", credentials: "include" });
      toast("Logs cleared");
      refreshLogs();
    });

    function renderStatus(data) {
      const dot = document.getElementById("statusDot");
      const text = document.getElementById("statusText");
      const accountInfo = document.getElementById("accountInfo");
      const loginPanel = document.getElementById("loginPanel");
      const controlPanel = document.getElementById("controlPanel");

      dot.className = "dot " + (data.connected ? "online" : "offline");
      text.textContent = data.connected ? "Connected" : "Disconnected";

      if (data.connected) {
        accountInfo.classList.remove("hidden");
        document.getElementById("accountId").textContent = data.account || "Unknown";
        document.getElementById("downloadCount").textContent = data.downloadCount ?? 0;
        loginPanel.classList.add("hidden");
        controlPanel.classList.remove("hidden");
      } else {
        accountInfo.classList.add("hidden");
        loginPanel.classList.remove("hidden");
        controlPanel.classList.add("hidden");
      }
    }

    async function refreshStatus() {
      try {
        const res = await fetch("/api/status", { credentials: "include" });
        const data = await res.json();
        renderStatus(data);
      } catch (err) {}
    }

    function renderLogs(logs) {
      const list = document.getElementById("logList");
      if (!logs || logs.length === 0) {
        list.innerHTML = '<div class="empty">No downloads yet.</div>';
        return;
      }
      list.innerHTML = logs.slice(0, 30).map((l) => `
        <div class="log-item">
          <span class="plat">${l.platform}</span>
          <span class="time">${l.time}</span>
          <span class="badge ${l.status === 'Success' ? 'success' : 'failed'}">${l.status}</span>
        </div>
      `).join("");
    }

    async function refreshLogs() {
      try {
        const res = await fetch("/api/logs", { credentials: "include" });
        const data = await res.json();
        renderLogs(data.logs);
      } catch (err) {}
    }

    refreshStatus();
    refreshLogs();
    setInterval(refreshStatus, 4000);
    setInterval(refreshLogs, 6000);
  </script>
</body>
</html>
